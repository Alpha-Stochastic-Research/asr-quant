name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'mkdocs.yml'
      - 'scripts/generate_docs.py'
      - 'scripts/rewrite_docs_asset_urls.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'mkdocs.yml'
      - 'scripts/generate_docs.py'
      - 'scripts/rewrite_docs_asset_urls.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install mkdocs mkdocs-material
      - name: Generate source-derived API reference
        run: python scripts/generate_docs.py
      - name: Build documentation
        run: |
          mkdocs build --strict
          python scripts/rewrite_docs_asset_urls.py
      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-branded-route:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify branded ASRQuant documentation routes
        env:
          ROOT_URL: https://docs.asr-lab.online/
          LEGACY_URL: https://docs.asr-lab.online/asrquant/
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "${ROOT_URL}?build=${GITHUB_SHA}" -o /tmp/root.html
          grep -q 'ASRQuant Documentation' /tmp/root.html
          grep -q "${ROOT_URL}assets/stylesheets/" /tmp/root.html
          grep -q "${ROOT_URL}assets/javascripts/" /tmp/root.html
          grep -q "${ROOT_URL}assets/brand/asrquant-mark.svg" /tmp/root.html

          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "${LEGACY_URL}?build=${GITHUB_SHA}" -o /tmp/legacy.html
          grep -q 'ASRQuant Documentation' /tmp/legacy.html
          grep -q '<base href="https://docs.asr-lab.online/">' /tmp/legacy.html
          grep -q "${ROOT_URL}assets/stylesheets/" /tmp/legacy.html

          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "${ROOT_URL}assets/brand/asrquant-mark.svg" -o /tmp/asrquant-mark.svg
          grep -q '<svg' /tmp/asrquant-mark.svg
          echo 'ASRQuant docs root and legacy /asrquant/ route are healthy.'
