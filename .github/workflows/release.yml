name: Release

on:
  push:
    branches: [main]
    paths:
      - RELEASE_v1.3.1_DEPLOY

permissions:
  contents: read

jobs:
  build:
    name: Build and validate ASRQuant 1.3.1
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify version metadata
        run: |
          python - <<'PY'
          import pathlib, re
          pyproject = pathlib.Path('pyproject.toml').read_text()
          version_py = pathlib.Path('src/asrquant/version.py').read_text()
          assert 'version = "1.3.1"' in pyproject
          assert '__version__ = "1.3.1"' in version_py
          print('ASRQuant release metadata: 1.3.1')
          PY

      - name: Build distributions
        run: |
          rm -rf dist build src/*.egg-info
          python -m build

      - name: Validate distributions
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz

      - name: Smoke test wheel
        run: |
          python -m venv .release-runtime
          .release-runtime/bin/python -m pip install --upgrade pip
          .release-runtime/bin/python -m pip install dist/*.whl
          .release-runtime/bin/python -c "import asrquant; assert asrquant.__version__ == '1.3.1'; print('ASRQuant', asrquant.__version__)"
          .release-runtime/bin/asrquant --version

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: asrquant-1.3.1-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish ASRQuant 1.3.1 to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/asrquant/1.3.1/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: asrquant-1.3.1-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

  github-release:
    name: Create GitHub Release v1.3.1
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: asrquant-1.3.1-distributions
          path: dist/

      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.1 \
            --target "${GITHUB_SHA}" \
            --title "ASRQuant 1.3.1" \
            --notes-file RELEASE_NOTES_v1.3.1.md \
            dist/*
