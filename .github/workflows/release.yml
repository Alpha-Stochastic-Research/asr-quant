name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build, validate, and attest distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine cyclonedx-bom

      - name: Verify release tag and package version
        run: python scripts/check_release.py "${{ github.event.release.tag_name }}"

      - name: Build distributions from a clean directory
        run: |
          rm -rf dist build src/*.egg-info
          python -m build

      - name: Validate distributions
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz

      - name: Verify wheel installation
        run: |
          python -m venv .release-runtime
          .release-runtime/bin/python -m pip install --upgrade pip
          .release-runtime/bin/python -m pip install dist/*.whl
          .release-runtime/bin/python -c "import asrquant; print(asrquant.__version__)"
          .release-runtime/bin/asrquant --version

      - name: Generate resolved runtime SBOM
        run: |
          mkdir -p release-metadata
          cyclonedx-py environment \
            --output-format JSON \
            --output-file release-metadata/asrquant-${{ github.event.release.tag_name }}-sbom.cdx.json \
            .release-runtime/bin/python
          sha256sum dist/*.whl dist/*.tar.gz > release-metadata/SHA256SUMS.txt

      - name: Attest Python distributions
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attest runtime SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: release-metadata/asrquant-${{ github.event.release.tag_name }}-sbom.cdx.json

      - name: Upload Python distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload release metadata
        uses: actions/upload-artifact@v5
        with:
          name: release-metadata
          path: release-metadata/
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/asrquant/
    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false
          print-hash: true

  attach-assets:
    name: Attach distributions and metadata to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: release-assets/

      - name: Download release metadata
        uses: actions/download-artifact@v6
        with:
          name: release-metadata
          path: release-assets/

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          test "${#assets[@]}" -gt 0
          gh release upload \
            "${RELEASE_TAG}" \
            "${assets[@]}" \
            --clobber \
            --repo "${GH_REPO}"
