name: Release ASRQuant 1.3.0 corrected build

on:
  push:
    branches: [main]
    paths:
      - RELEASE_v1.3.0_BUILD1

permissions:
  contents: read

jobs:
  build:
    name: Build and validate ASRQuant 1.3.0 build 1
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine wheel

      - name: Verify version metadata
        run: |
          python - <<'PY'
          import pathlib
          pyproject = pathlib.Path('pyproject.toml').read_text()
          version_py = pathlib.Path('src/asrquant/version.py').read_text()
          assert 'version = "1.3.0"' in pyproject
          assert '__version__ = "1.3.0"' in version_py
          print('ASRQuant release metadata: 1.3.0')
          PY

      - name: Build corrected wheel
        run: |
          rm -rf dist build src/*.egg-info
          python -m build --wheel
          python -m wheel tags --build 1 --remove dist/asrquant-1.3.0-py3-none-any.whl
          ls -lh dist/

      - name: Validate corrected wheel
        run: python -m twine check --strict dist/asrquant-1.3.0-1-py3-none-any.whl

      - name: Smoke test corrected wheel
        run: |
          python -m venv .release-runtime
          .release-runtime/bin/python -m pip install --upgrade pip
          .release-runtime/bin/python -m pip install dist/asrquant-1.3.0-1-py3-none-any.whl
          .release-runtime/bin/python -c "import asrquant; assert asrquant.__version__ == '1.3.0'; print('ASRQuant', asrquant.__version__)"
          .release-runtime/bin/asrquant --version

      - name: Upload corrected distribution
        uses: actions/upload-artifact@v4
        with:
          name: asrquant-1.3.0-build1
          path: dist/asrquant-1.3.0-1-py3-none-any.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish corrected ASRQuant 1.3.0 wheel to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/asrquant/1.3.0/
    permissions:
      id-token: write

    steps:
      - name: Download corrected distribution
        uses: actions/download-artifact@v4
        with:
          name: asrquant-1.3.0-build1
          path: dist/

      - name: Publish corrected 1.3.0 build to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

  github-release:
    name: Update GitHub Release v1.3.0
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download corrected distribution
        uses: actions/download-artifact@v4
        with:
          name: asrquant-1.3.0-build1
          path: dist/

      - name: Attach corrected wheel to v1.3.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.3.0 dist/asrquant-1.3.0-1-py3-none-any.whl --repo "${GITHUB_REPOSITORY}"
          gh release edit v1.3.0 --title "ASRQuant 1.3.0" --notes-file RELEASE_NOTES_v1.3.0.md --repo "${GITHUB_REPOSITORY}"
