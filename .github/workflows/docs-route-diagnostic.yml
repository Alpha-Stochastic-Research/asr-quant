name: Docs route diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/docs-route-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect branded docs host and candidate routes
        shell: bash
        run: |
          set -u
          echo 'DNS:'
          getent ahosts docs.asr-lab.online || true
          echo
          for url in \
            'https://docs.asr-lab.online/' \
            'https://docs.asr-lab.online/asrquant' \
            'https://docs.asr-lab.online/asrquant/' \
            'https://docs.asr-lab.online/asr-quant/' \
            'https://alpha-stochastic-research.github.io/asr-quant/'; do
            echo "===== $url ====="
            code=$(curl -sS -L -o /tmp/body -w '%{http_code}' "$url" || true)
            echo "HTTP $code"
            curl -sS -I -L "$url" | sed -n '1,20p' || true
            echo 'TITLE/SNIPPET:'
            tr '\n' ' ' </tmp/body | sed 's/[[:space:]]\+/ /g' | cut -c1-700 || true
            echo
          done
