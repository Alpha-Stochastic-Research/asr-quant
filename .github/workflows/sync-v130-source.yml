name: Sync ASRQuant 1.3.0 source

on:
  push:
    branches: ["release/v1.3.0"]
    paths:
      - "release-bundles/v1.3.0/READY"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v1.3.0
          fetch-depth: 0
      - name: Reconstruct audited release payload
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/asrquant130.tar.xz
          for f in release-bundles/v1.3.0/chunk-*; do
            tr -cd 'A-Za-z0-9+/=' < "$f" | base64 --decode >> /tmp/asrquant130.tar.xz
          done
          xz -t /tmp/asrquant130.tar.xz
          mkdir -p /tmp/asr130
          tar -xJf /tmp/asrquant130.tar.xz -C /tmp/asr130
          rm -rf /tmp/wheel src/asrquant
          mkdir -p /tmp/wheel src/asrquant
          python - <<'PY'
          import zipfile
          wheel='/tmp/asr130/dist/asrquant-1.3.0-py3-none-any.whl'
          with zipfile.ZipFile(wheel) as z:
              z.extractall('/tmp/wheel')
          PY
          cp -a /tmp/wheel/asrquant/. src/asrquant/
          cp /tmp/asr130/pyproject.toml pyproject.toml
          cp /tmp/asr130/setup.py setup.py
          cp /tmp/asr130/MANIFEST.in MANIFEST.in
          cp /tmp/asr130/README.md README.md
          cp /tmp/asr130/CHANGELOG.md CHANGELOG.md
          cp /tmp/asr130/CITATION.cff CITATION.cff
          cp /tmp/asr130/LICENSE LICENSE
          cp /tmp/asr130/RELEASE_NOTES_v1.3.0.md RELEASE_NOTES_v1.3.0.md
          cp -a /tmp/asr130/scripts/. scripts/
          cp -a /tmp/asr130/requirements/. requirements/
          cp /tmp/asr130/tests/test_release_integrity_v130.py tests/
          cp /tmp/asr130/tests/test_v130_audit_fixes.py tests/
          cp /tmp/asr130/tests/test_v130_market_infrastructure.py tests/
          cp /tmp/asr130/tests/test_v130_quant_invariants.py tests/
          cp /tmp/asr130/tests/test_v130_research_platform.py tests/
          cp /tmp/asr130/tests/test_v130_validation_data.py tests/
      - name: Upgrade hosted CI for v1.3.0
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ci.yml')
          s=p.read_text()
          s=s.replace('python-version: ["3.10", "3.11", "3.12", "3.13"]','python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]')
          s=s.replace('group: [quant, surfaces, rates, discovery, v120, paper, production]','group: [quant, surfaces, rates, discovery, v120, v130, paper, production]')
          s=s.replace('python -m pip install -e ".[dev]"','python -m pip install -e ".[all,dev]"')
          p.write_text(s)
          PY
      - name: Verify v1.3.0 release payload
        env:
          PYTHONPATH: src
          MPLBACKEND: Agg
        run: |
          python scripts/check_release.py v1.3.0
          python -m pytest -q \
            tests/test_release_integrity_v130.py \
            tests/test_v130_audit_fixes.py \
            tests/test_v130_market_infrastructure.py \
            tests/test_v130_quant_invariants.py \
            tests/test_v130_research_platform.py \
            tests/test_v130_validation_data.py
      - name: Commit release source to branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-bundles/v1.3.0
          rm -f .github/workflows/sync-v130-source.yml
          touch RELEASE_v1.3.0_READY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: ASRQuant 1.3.0" -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin HEAD:release/v1.3.0
