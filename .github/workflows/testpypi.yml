# Retry trigger after TestPyPI Trusted Publisher configuration
name: Publish to TestPyPI

on:
  workflow_dispatch:
  push:
    branches:
      - release/1.3.0rc1

permissions:
  contents: read

concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_VERSION: 1.3.0rc1

jobs:
  build:
    name: Build and validate ASRQuant 1.3.0rc1
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Preflight release candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, tomllib
          with open('pyproject.toml', 'rb') as f:
              project = tomllib.load(f)['project']
          version = project['version']
          assert version == '1.3.0rc1', f'Unexpected version: {version}'
          assert not pathlib.Path('paper').exists(), 'paper/ must not be present in the RC'
          required = [
              'src/asrquant/calibration.py',
              'src/asrquant/credit.py',
              'src/asrquant/experiments.py',
              'tests/test_v130_quant_invariants.py',
              'tests/test_v130_market_infrastructure.py',
              'tests/test_v130_validation_data.py',
              'tests/test_v130_research_platform.py',
          ]
          missing = [p for p in required if not pathlib.Path(p).is_file()]
          assert not missing, f'Missing RC1 files: {missing}'
          print('RC1 preflight OK:', version)
          PY

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile sources
        run: python -m compileall -q src tests examples scripts

      - name: Check release metadata
        run: python scripts/check_release.py v1.3.0rc1

      - name: Run full pytest validation
        run: python scripts/test_all.py --group all

      - name: Build distributions from a clean directory
        run: |
          rm -rf dist build src/*.egg-info
          python -m build

      - name: Validate distributions
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz

      - name: Verify distribution names
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/asrquant-1.3.0rc1-py3-none-any.whl
          test -f dist/asrquant-1.3.0rc1.tar.gz
          if tar -tzf dist/asrquant-1.3.0rc1.tar.gz | grep -E '(^|/)paper/'; then
            echo 'paper/ unexpectedly present in sdist'
            exit 1
          fi

      - name: Verify clean wheel installation
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .test-install
          .test-install/bin/python -m pip install --upgrade pip
          .test-install/bin/python -m pip install dist/asrquant-1.3.0rc1-py3-none-any.whl
          .test-install/bin/python - <<'PY'
          import asrquant
          import importlib.metadata
          expected = '1.3.0rc1'
          assert asrquant.__version__ == expected, asrquant.__version__
          assert importlib.metadata.version('asrquant') == expected
          print('Clean wheel install OK:', expected)
          PY
          .test-install/bin/asrquant --version

      - name: Upload Python distributions
        uses: actions/upload-artifact@v5
        with:
          name: asrquant-1.3.0rc1-distributions
          path: |
            dist/asrquant-1.3.0rc1-py3-none-any.whl
            dist/asrquant-1.3.0rc1.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-testpypi:
    name: Publish ASRQuant 1.3.0rc1 to TestPyPI
    needs: build
    if: github.ref == 'refs/heads/release/1.3.0rc1'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/asrquant/1.3.0rc1/
    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v6
        with:
          name: asrquant-1.3.0rc1-distributions
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
          print-hash: true

  verify-testpypi:
    name: Verify TestPyPI installation
    needs: publish-testpypi
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install RC1 from TestPyPI and verify
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5 6; do
            if python -m pip install --no-cache-dir --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ 'asrquant==1.3.0rc1'; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo 'TestPyPI package was not installable after retries.'
              exit 1
            fi
            sleep 20
          done
          python - <<'PY'
          import asrquant
          import importlib.metadata
          expected = '1.3.0rc1'
          assert asrquant.__version__ == expected, asrquant.__version__
          assert importlib.metadata.version('asrquant') == expected
          print('TESTPYPI RC1 VERIFIED:', expected)
          PY
