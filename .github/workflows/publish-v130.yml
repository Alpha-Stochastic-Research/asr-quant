name: Publish ASRQuant 1.3.0

on:
  push:
    branches: [main]
    paths:
      - "RELEASE_v1.3.0_READY"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify source release contract
        run: python scripts/check_release.py v1.3.0
      - name: Wait for hosted CI on exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 90); do
            run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 10 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
      - name: Create immutable v1.3.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.3.0 >/dev/null 2>&1; then
            echo "v1.3.0 already exists; refusing to retag"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.3.0 -m "ASRQuant 1.3.0"
          git push origin v1.3.0
          gh release create v1.3.0 --verify-tag --title "ASRQuant 1.3.0" --notes-file RELEASE_NOTES_v1.3.0.md
      - name: Clean one-shot release marker
        shell: bash
        run: |
          set -euo pipefail
          git rm RELEASE_v1.3.0_READY .github/workflows/publish-v130.yml
          git commit -m "chore: complete ASRQuant 1.3.0 publication" -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin HEAD:main
