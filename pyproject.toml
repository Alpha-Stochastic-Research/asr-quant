[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asrquant"
version = "1.1.0"
description = "Auditable quantitative research, guarded broker execution, and production-readiness controls with a one-import Python API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Alpha Stochastic Research", email = "research@asr-lab.online"},
  {name = "Alpha Kabinet TOURE"}
]
keywords = ["quantitative finance", "backtesting", "visualization", "risk", "portfolio", "reproducibility"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Office/Business :: Financial :: Investment"
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<4",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "plotly>=5.20,<7",
  "statsmodels>=0.14,<1",
  "scikit-learn>=1.4,<2",
  "jinja2>=3.1,<4",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
  "pypdf>=6.14.2,<7"
]

[project.optional-dependencies]
ml = ["shap>=0.45", "hmmlearn>=0.3"]
data = ["yfinance>=0.2.40", "openpyxl>=3.1", "pyarrow>=16"]
optimization = ["cvxpy>=1.4"]
volatility = ["arch>=7.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.13", "build>=1.2", "twine>=5", "pip-audit>=2.7", "bandit[toml]>=1.7", "detect-secrets>=1.5", "cyclonedx-bom>=5.0"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
all = ["shap>=0.45", "hmmlearn>=0.3", "cvxpy>=1.4", "arch>=7.0", "yfinance>=0.2.40", "openpyxl>=3.1", "pyarrow>=16"]

[project.scripts]
asrquant = "asrquant.cli:main"

[project.urls]
Homepage = "https://www.asr-lab.online"
Repository = "https://github.com/Alpha-Stochastic-Research/asrquant"
Documentation = "https://github.com/Alpha-Stochastic-Research/asrquant/tree/main/docs"
Issues = "https://github.com/Alpha-Stochastic-Research/asrquant/issues"
Changelog = "https://github.com/Alpha-Stochastic-Research/asrquant/blob/main/CHANGELOG.md"
Paper = "https://github.com/Alpha-Stochastic-Research/asrquant/blob/main/paper/ASRQuant_paper.pdf"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep CI focused on correctness-oriented rules. Line wrapping and import
# normalization are handled separately and do not block scientific results.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/asrquant/__init__.py" = ["F401"]
"src/asrquant/viz/__init__.py" = ["F401"]
"src/asrquant/research.py" = ["F401"]

[tool.mypy]
# The CI type-check runs on Python 3.12 because current NumPy stubs use
# PEP 695 type statements. Runtime syntax compatibility with Python 3.10
# remains enforced independently by the compatibility test matrix.
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "silent"
